# Rus-Trader Configuration
# Copy this file to config.yaml and fill in your values

# T-Invest API settings
tinkoff:
  # API token from https://www.tbank.ru/invest/settings/
  token: "your-tinkoff-token-here"
  # true = sandbox mode (no real money), false = live trading
  sandbox: true
  # Account ID (leave empty in sandbox — will be auto-created)
  account_id: ""
  # Path to a PEM file with the root CA certificate (corporate CA / MITM proxy).
  # Preferred fix for "x509: certificate signed by unknown authority".
  tls_ca_cert_file: ""
  # Disable TLS certificate verification entirely. INSECURE — traffic (including
  # the API token) becomes vulnerable to MITM. Use only as a temporary workaround.
  insecure_skip_verify: false

# LLM provider settings (OpenAI-compatible API, OpenRouter by default)
llm:
  # API key from https://openrouter.ai/keys
  api_key: "sk-or-your-openrouter-key"
  # OpenAI-compatible endpoint. Change only for another provider
  # (e.g. https://api.deepseek.com/v1 for direct DeepSeek access).
  base_url: "https://openrouter.ai/api/v1"
  # Main model for Screening Agent + Position Manager (OpenRouter model id).
  # Alternatives: deepseek/deepseek-v4-flash (much cheaper), qwen/qwen3.7-plus, google/gemini-2.5-flash
  model: "deepseek/deepseek-v4-pro"
  # Reasoning depth for models that support it: low / medium / high (empty = provider default)
  reasoning_effort: "medium"
  # Request timeout in seconds (reasoning models take 30-90s)
  timeout_seconds: 120
  # Hard limit for full user prompt size (characters)
  prompt_max_chars: 24000
  # Max total chars for "ticker briefs" section
  max_ticker_brief_chars: 900
  # Max ticker-specific news lines in prompt
  max_ticker_news_items: 8
  # Max world news lines in prompt
  max_world_news_items: 5
  # Max headline/title length after truncation
  max_news_title_chars: 120

# Trading parameters
trading:
  # Interval between analysis cycles (e.g., "15m", "30m", "1h")
  interval: "15m"
  # Maximum amount (RUB) to invest per single trade (scaled by confidence)
  max_position_rub: 10000
  # Minimum AI confidence (0-100) to execute a BUY
  min_confidence: 70
  # Default Stop-Loss percentage (e.g., 3 = 3% below entry)
  default_stop_loss_pct: 3.0
  # Default Take-Profit percentage (e.g., 4.5 = 4.5% above entry)
  default_take_profit_pct: 4.5
  # Maximum number of tickers to send for AI analysis per cycle
  max_analysis_tickers: 20
  # Размер пула кандидатов для расчёта индикаторов (до пре-фильтра и Screener).
  # Должен быть больше max_analysis_tickers, чтобы после отсечения тикеров
  # жёсткими BUY-фильтрами (ATR%, RSI, uptrend, cooldown) оставалось достаточно
  # кандидатов для ИИ. 0 = auto: max_analysis_tickers*3.
  candidate_pool_size: 60
  # Maximum bid/ask spread (%) to allow BUY. 0 = disabled
  max_spread_pct: 0.3
  # Trailing stop: enable automatic SL adjustment
  trailing_stop_enabled: true
  # Trailing stop: % progress to TP to move SL to breakeven (e.g., 50 = 50%)
  trailing_breakeven_pct: 50
  # Trailing stop: % progress to TP to lock 50% of profit (e.g., 75 = 75%)
  trailing_lock_profit_pct: 75
  # Limit order slippage (%). 0 = use market orders
  limit_order_slippage: 0.1
  # Block BUY orders in last hour of trading (17:50-18:50 MSK)
  no_last_hour_buy: true
  # Minimum SL distance from entry (%). Floor: AI SL closer than this will be widened.
  min_stop_loss_pct: 2.0
  # ATR multiplier for dynamic SL floor: slFloor = max(min_stop_loss_pct, atr_sl_multiplier*ATR/price*100)
  atr_sl_multiplier: 1.5
  # Minimum TP distance from entry (%). AI TP closer than this will be overridden
  min_take_profit_pct: 2.5
  # Minimum Risk/Reward ratio (TP distance / SL distance). e.g., 1.5 = TP must be 1.5x SL
  min_risk_reward_ratio: 1.5
  # Block BUY when EMA9 < EMA21 (downtrend filter)
  require_uptrend: true
  # Circuit breaker: stop trading when daily loss exceeds this amount (RUB). 0 = disabled
  max_daily_loss_rub: 1500
  # Minimum screener score to include ticker for analysis (0 = include all)
  min_screener_score: 2
  # Minimum ATR/price % to allow BUY (filters low-volatility tickers). 0 = disabled
  min_atr_pct: 1.2
  # Block BUY on tickers that had losses in last N days. 0 = disabled
  recent_loss_cooldown_days: 1
  # Block BUY after N consecutive losing trades on the same ticker (0 = disabled)
  max_losing_streak_per_ticker: 2
  # Window (in days) for counting losing streak. Older trades are ignored so blocks
  # naturally expire and never become permanent. 0 = unlimited (not recommended).
  losing_streak_window_days: 7
  # Cooldown (minutes) before re-entering a ticker after a SELL. Default 7200 (5 days):
  # статистика показала, что повторные входы в тот же тикер в первые дни убыточны.
  cooldown_minutes: 7200
  # Minimum hold time (minutes) before AI may close a position. Watchdog SL/TP ignores this.
  min_hold_minutes: 240
  # Fast SL/TP watchdog loop: checks open positions every interval and force-closes
  # breached stops with a market order, without waiting for the AI cycle. "0" = disabled.
  stop_watchdog_interval: "2m"
  # Quotes deviating more than this % (per day or vs entry) are treated as bad data
  # and excluded from analysis/orders (sandbox regularly returns garbage prices)
  max_price_deviation_pct: 30
  # Cap on total open portfolio risk: Σ(entry−SL)×shares across open positions (RUB).
  # New BUYs that would push total risk above this are blocked. 0 = disabled
  max_portfolio_risk_rub: 2000
  # Broker commission per side (%), included in PnL calculation
  commission_pct: 0.025
  # Maximum simultaneously open positions
  max_open_positions: 5
  # Maximum trades per day (BUY+SELL)
  max_daily_trades: 15

# Telegram notifications (optional)
telegram:
  enabled: false
  # Bot token from @BotFather
  bot_token: "your-telegram-bot-token"
  # Chat ID (use @userinfobot to find yours)
  chat_id: 0

# Web dashboard
web:
  # Port for the dashboard
  port: 8080
  # Basic auth for the dashboard. Both must be set together, or startup fails.
  # Leave empty only when the port is bound to loopback — the dashboard exposes
  # the full portfolio and trade history.
  auth_user: ""
  auth_password: ""

# Logging
logging:
  # Log level: debug, info, warn, error
  level: "info"

# Dividend calendar (SmartLab)
dividends:
  enabled: true
  cache_ttl_hours: 12
  lookahead_days: 30

# Trade Journal with daily LLM review
journal:
  enabled: true
  max_lessons_in_prompt: 5
  max_lesson_age_days: 7
  min_trades_for_review: 1

# AI agent-specific settings (override llm.* per agent)
ai_agents:
  screening:
    max_chars: 16000
    max_tickers: 20
  position_manager:
    max_chars: 8000
  journal_review:
    max_chars: 12000
    # Use cheaper model for review (empty = use main model)
    model: ""

# Order book metrics (L2 snapshot)
orderbook:
  enabled: true
  depth: 20
  wall_threshold: 5.0
  concurrency: 5

# Sentiment scoring (news + SmartLab forum → LLM)
sentiment:
  enabled: true
  # Cheap model is enough for sentiment scoring
  model: "deepseek/deepseek-v4-flash"
  max_items_per_ticker: 5
  forum_enabled: true
  max_forum_posts: 5

# Vector pattern memory (SQLite + OpenRouter embeddings)
vectordb:
  enabled: false
  openrouter_api_key: "sk-or-your-key"
  embedding_model: "openai/text-embedding-3-small"
  max_similar_patterns: 5
  min_similarity: 0.7
